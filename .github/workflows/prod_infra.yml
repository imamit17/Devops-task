name: Infra Deploy - Prod

on:
  push:
    paths:
      - 'Infra/tfvars/prod/**'

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan - Prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CREDENTIALS }}

      - name: Terraform Init
        working-directory: Infra/infrastructure
        run: terraform init -backend-config="resource_group_name=final_test" -backend-config="storage_account_name=aztfdevops" -backend-config="container_name=tfstate-prod" -backend-config="key=prodterraform.tfstate"

      - name: Terraform Plan
        working-directory: Infra/infrastructure
        run: terraform plan -var-file="../tfvars/prod/prod.tfvars"

  terraform-apply:
    name: Terraform Apply - Prod
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: prod-infra-approval  

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CREDENTIALS }}

      - name: Terraform Init
        working-directory: Infra/infrastructure
        run: terraform init -backend-config="resource_group_name=final_test" -backend-config="storage_account_name=aztfdevops" -backend-config="container_name=tfstate-prod" -backend-config="key=prodterraform.tfstate"

      - name: Terraform Apply
        working-directory: Infra/infrastructure
        run: terraform apply -var-file="../tfvars/prod/prod.tfvars" -auto-approve
