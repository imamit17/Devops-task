name: Infra Deploy - Prod

on:
  push:
    paths:
      - 'tfvars/prod/**'

permissions:
  id-token: write
  contents: read

jobs:
  terraform-prod:
    name: Apply Terraform - Prod
    runs-on: ubuntu-latest
    environment: prod-infra-approval

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}


      - name: Terraform Init
        working-directory: Infra/infrastructure
        run: terraform init

      - name: Terraform Plan
        working-directory: Infra/infrastructure
        run: terraform plan -var-file="../tfvars/prod/prod.tfvars"

      - name: Terraform Apply (manual approval required)
        working-directory: Infra/infrastructure
        run: terraform apply -var-file="../tfvars/prod/prod.tfvars"
