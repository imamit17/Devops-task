name: Infra Deploy - Staging

on:
  push:
    paths:
      - 'Infra/tfvars/staging/**'

jobs:
  terraform-plan:
    name: Terraform Plan - Staging
    runs-on: ubuntu-latest

    outputs:
      backend-key: staging.terraform.tfstate

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CREDENTIALS }}

      - name: Terraform Init
        working-directory: Infra/infrastructure
        run: terraform init \
          -backend-config="resource_group_name=final_test" \
          -backend-config="storage_account_name=aztfdevops" \
          -backend-config="container_name=tfstate-staging" \
          -backend-config="key=staging.terraform.tfstate"

      - name: Terraform Plan
        working-directory: Infra/infrastructure
        run: terraform plan -var-file="../tfvars/staging/staging.tfvars"

  terraform-apply:
    name: Terraform Apply - Staging
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: staging-infra-approval  # ✅ triggers GitHub manual approval

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CREDENTIALS }}

      - name: Terraform Init
        working-directory: Infra/infrastructure
        run: terraform init \
          -backend-config="resource_group_name=final_test" \
          -backend-config="storage_account_name=aztfdevops" \
          -backend-config="container_name=tfstate-staging" \
          -backend-config="key=staging.terraform.tfstate"

      - name: Terraform Apply
        working-directory: Infra/infrastructure
        run: terraform apply -var-file="../tfvars/staging/staging.tfvars" -auto-approve
